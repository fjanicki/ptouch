<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <meta name="description" content="Design and print labels on Brother P-touch printers from your browser. No install, no account, works offline." />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome and the iOS status bar match the top bar (--surface). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191e29" media="(prefers-color-scheme: dark)" />
    <!-- iPhone / iPad home screen (P5): full-screen app named "ptouch", content below the
         status bar; digit runs on labels (A-001, 0123…) are not turned into phone links. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ptouch" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>ptouch studio</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>ptouch studio needs JavaScript and WebAssembly to design and print labels.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
