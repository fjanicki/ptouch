# Brother P-touch model and media table for the `ptouch` crate.
# Companion to docs/PROTOCOL.md (section numbers below refer to it). TOML 1.0; hex integer literals are used for byte values.
#
# Rules:
#   - Values come from Brother docs [D1-D4], the MacPrintSDK/Android SDK spec databases [SDK], P-touch Editor printer
#     descriptions [PTD], live hardware [HW] or hardware-verified community projects. Nothing is invented.
#   - A key whose value is UNKNOWN is OMITTED and its name is listed in the model's `unknown` array.
#   - `quirks` are short human-readable notes; normative behaviour is in PROTOCOL.md.
#
# Model keys:
#   name                      marketing name
#   model_code                status byte st[4]
#   series_code               status byte st[3]
#   usb_pid                   USB product ID (VID = meta.usb_vendor_id); omitted for BT-only models
#   bluetooth / ble / network transport availability (bluetooth = Classic SPP/RFCOMM; network = TCP 9100)
#   dpi                       head-direction resolution (dots per inch across the tape)
#   high_res_feed_dpi         feed resolution in high-resolution mode (only if supports_high_resolution)
#   head_pins                 print-head pins = bits per raster line
#   bytes_per_line            head_pins / 8 (length of an uncompressed G line)
#   max_print_pins            largest print area among supported media
#   max_tape_mm               widest supported tape
#   null_bytes                invalidate length (00 x N) before ESC @ / cancel
#   page_command              "start_end" (ESC i z n9 = 0/1) or "start_next_end" (n9 = 0/1/2, single/last page = 2)
#   protocol_version          SDK command-protocol version (gates ESC i p / ESC i L / ESC i C / ESC i 18), PROTOCOL.md §3.3
#   needs_mode_switch         send ESC i a 01 before raster data (Brother SDK sends it to every PT model)
#   raster_is_default         raster is the power-on command mode (if false, ESC i a 01 is strictly required)
#   supports_compression      printer accepts M 02 (TIFF/PackBits)
#   default_compression       "packbits" or "none": what the library sends by default (PROTOCOL.md §5.5)
#   supports_auto_cut         ESC i M bit 0x40 = automatic full cut
#   supports_cut_mark         ESC i M bit 0x40 = print cut marks (models without cutter)
#   supports_cut_every        ESC i A n accepted
#   supports_chain            ESC i K bit 0x08 ("no chain printing") is meaningful, i.e. chain printing can be selected
#   supports_half_cut         ESC i K bit 0x04
#   supports_special_tape     ESC i K bit 0x10 (no cut); special_tape_k is the full ESC i K value the SDK sends
#   supports_mirror           ESC i M bit 0x80 (otherwise mirror in software)
#   supports_two_color        two-colour printing (false for every PT model)
#   supports_high_resolution  ESC i K bit 0x40
#   supports_draft            ESC i K bit 0x01 (low-resolution / draft)
#   supports_status_notify    library sends ESC i ! 00 to get pushed status (true where the SDK has ChangeStatusMode
#                             or D1/D2/D4 list the command for the model; see per-model quirks for conflicts)
#   sends_stored_up_print     send ESC i p 01                          (protocol gate)
#   sends_color_info          send ESC i L 00 01 01 + ESC i C 01 FF FF FF (protocol gate)
#   sends_copies_command      send ESC i k c 01 00. Rule (PROTOCOL.md §3.1): start_next_end models, except where a
#                             Brother driver dump for the family omits it (D4: E310BT/E510/E560BT, and by family
#                             D410/D460BT/D610BT). Both SDKs send it on every start_next_end model.
#   sends_mode_reset_at_end   library sends ESC i a FF after the job by default: true where the D4 dump sends it
#                             (E/D series) and on N25BT (SDK is the only source). Both SDKs send it, as a separate
#                             write, after the last page on EVERY model; the D1/D2 dumps do not. Optional elsewhere.
#   cancel_command            "esc_at" (00xN 1B 40) or "esc_i_18" (00xN 1B 69 18)
#   bt_socket_security        Android SDK RFCOMM socket type: "insecure" or "secure". Informational; the library
#                             uses OS default security on a bonded link (PROTOCOL.md §2.1 "Link security").
#   rfcomm_channel_observed   SPP RFCOMM channel seen on real hardware (always resolve via SDP first)
#   min_feed_dots             documented minimum / default ESC i d value at normal resolution
#   min_length_mm             Brother minimum print-data length in mm = raster length + 2 x feed margin (ESC i d),
#                             from the model's Brother raster doc [D1-D4], else a non-zero SDK MinPrintPaperLength.
#                             SDK value 0 means "not checked", not "no minimum" (the SDK has 0 for P710BT, D1 says
#                             4.4 mm), so such models list the key as unknown. PROTOCOL.md §5.6 gives the padding rule.
#   editor_min_label_mm       P-touch Editor minimum label length (PTD minlen / 10). Editor UI limit only; for
#                             P300BT / N25BT it includes the ~25 mm leader. MUST NOT be used to pad raster data.
#   max_length_mm             maximum print length (PTD maxlen / 10; agrees with D1-D4)
#   battery_format            how to decode st[6] (PROTOCOL.md §4.7): "reserved" (doc says fixed 00: report unknown),
#                             "legacy" (00-04/FF, P900 family [D2]), "level_ac" (2x/3x/37 [D2 P910BT, D4]),
#                             "none" (no battery data, SDK PS_BAT_NON). Values without a Brother doc are marked
#                             "inferred" in the model's quirks.
#   media                     ids of [[media]] entries the model supports
#
# Media keys:
#   id, geometry ("pt128" | "pt3" | "aura64" | "pt560"), head_pins, kind ("tze" | "hs2" | "hs3" | "sl" | "fle"),
#   width_mm (nominal), media_width_byte (st[10] and ESC i z n3), length_mm (FLe only; st[17] and ESC i z n4),
#   status_media_type (expected st[11]; TZe geometry also applies to 0x03, 0x04, 0x14, 0x15, 0x16),
#   print_info_media_type (ESC i z n2 the SDK sends), print_info_media_type_high_res (n2 in high-res mode, if any),
#   left_margin_pins / print_pins / right_margin_pins (pin numbering per PROTOCOL.md §5.1: pin 0 = LSB of last byte),
#   tape_width_dots (physical tape width in head dots), default_feed_dots (default ESC i d),
#   physical_length_dots (FLe: physical label length, 45 mm at 360 dpi [PTD]),
#   printable_length_dots (FLe: max raster lines per label = physical length - 2 x default_feed_dots [SDK]).

schema_version = 1

[meta]
usb_vendor_id = 0x04F9
usb_out_endpoint = 0x02
usb_in_endpoint = 0x81
spp_uuid = "00001101-0000-1000-8000-00805F9B34FB"
status_length = 32
status_header = [0x80, 0x20, 0x42]
ble_service_uuid = "A76EB9E0-F3AC-4990-84CF-3A94D2426B2B"
ble_read_uuid = "A76EB9E1-F3AC-4990-84CF-3A94D2426B2B"
ble_write_uuid = "A76EB9E2-F3AC-4990-84CF-3A94D2426B2B"
ble_write_no_response_uuid = "A76EB9E3-F3AC-4990-84CF-3A94D2426B2B"
ble_notify_uuid = "A76EB9E4-F3AC-4990-84CF-3A94D2426B2B"
snmp_status_oid = "1.3.6.1.4.1.2435.3.3.9.1.6.1.0"

