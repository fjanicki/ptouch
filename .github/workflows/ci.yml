# CI: Rust formatting, lints, tests on Linux and macOS, the no_std / wasm guards of the sans-IO
# core, workflow lint, and the web studio (ptouch-wasm + Vite app, via the reusable web.yml).
# This whole workflow gates the Pages deploy: pages.yml runs after a successful CI run on main
# (workflow_run) and calls it (workflow_call) for manual deploys, so the core's golden byte-stream
# tests, fmt, clippy, gen-models --check and the no_std build all guard what ships, and nothing
# runs twice per push. docs/ARCHITECTURE.md §8, §9; action versions per §10.
# Hardware tests are `#[ignore]`d and never run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from pages.yml (no clash with a push run).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Must match rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: rustdoc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: generated model table is up to date
        run: cargo xtask gen-models --check
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12
      - name: actionlint
        run: actionlint

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace
      - name: core without default features
        run: cargo test -p ptouch --no-default-features --lib --tests

  no-std:
    name: wasm + no_std core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: wasm32 (default features)
        run: cargo check -p ptouch --target wasm32-unknown-unknown
      - name: wasm32 (all features)
        run: cargo check -p ptouch --all-features --target wasm32-unknown-unknown
      - name: no_std + alloc (thumbv7em-none-eabihf)
        run: cargo build -p ptouch --no-default-features --target thumbv7em-none-eabihf
      - name: clippy on wasm32
        run: cargo clippy -p ptouch --all-features --target wasm32-unknown-unknown -- -D warnings

  web:
    name: web studio
    uses: ./.github/workflows/web.yml
